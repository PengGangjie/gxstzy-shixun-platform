<style>
:root {
  --primary:#008742;--primary-dark:#006B35;--primary-light:#008842;
  --teal:#218483;--bg-page:#f4f4f4;--bg-light:#f1fff3;--text:#323232;--muted:#666;--border:#e5e5e5;--web-w:1200px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:16px;color:var(--text);line-height:1.75;background:var(--bg-page)}
a{color:var(--primary);text-decoration:none} a:hover{color:var(--primary-light)}
.web{max-width:var(--web-w);margin:0 auto;padding:0 15px}
.link-top{background:#fff;border-bottom:1px solid #eee;font-size:14px}
.link-top .web{display:flex;justify-content:space-between;flex-wrap:nowrap;min-height:48px;align-items:center;gap:12px}
.link-top ul{list-style:none;display:flex;flex-wrap:wrap;gap:4px 0;margin:0;padding:0}
.link-top ul.nav-links{flex:1 1 auto;min-width:0}
.link-top ul.credit{flex:0 0 auto;margin-left:auto;flex-wrap:nowrap;white-space:nowrap}
.link-top li{padding:0 14px;line-height:48px;color:#2d2d2d}
.link-top ul.credit li{padding:0 10px;font-size:13px;color:#666}
.site-logo{padding:42px 0 36px;background:var(--primary) url("assets/logo_bg.png") no-repeat top center/cover}
.site-logo .web{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px}
.site-logo a.logo img{max-width:864px;width:100%;height:auto;display:block}
.site-logo .searchbox{flex:0 0 auto;margin-top:4px;position:relative}
.site-logo .searchbox .search-inner{background:#fff;width:274px;max-width:100%;height:40px;border-radius:5px;overflow:hidden;display:flex;align-items:center}
.site-logo .searchbox .text{flex:1;height:40px;border:none;outline:none;line-height:40px;padding:0 15px;font-size:14px;min-width:0}
.site-logo .searchbox .submit{width:44px;height:40px;flex-shrink:0;border:none;outline:none;cursor:pointer;background:url("assets/search.png") no-repeat center center;background-size:18px 18px}
.global-search-results{position:absolute;right:0;top:46px;width:min(420px,calc(100vw - 30px));max-height:360px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:200}
.global-search-results[hidden]{display:none!important}
.global-search-results .gs-head{padding:8px 12px;font-size:12px;color:var(--muted);background:#fafafa;border-bottom:1px solid var(--border)}
.global-search-results a{display:block;padding:10px 12px;border-bottom:1px solid #f0f0f0;color:var(--text);font-size:14px;line-height:1.5}
.global-search-results a:hover{background:var(--bg-light)}
.global-search-results a strong{color:var(--primary);font-weight:normal}
.global-search-results .gs-meta{font-size:12px;color:var(--muted);margin-top:2px}
.doc-subbar{background:rgba(0,0,0,.12);border-top:1px solid rgba(255,255,255,.15)}
.doc-subbar .web{display:flex;justify-content:space-between;flex-wrap:wrap;min-height:44px;align-items:center;color:#fff;font-size:14px}
.navbar{background:#005c2d;position:sticky;top:0;z-index:100;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.navbar ul{list-style:none;display:flex;flex-wrap:wrap}
.navbar li a{display:block;padding:0 14px;height:60px;line-height:60px;color:#fff;font-size:15px;white-space:nowrap}
.navbar li a:hover,.navbar li a.active{background:#1b8650;color:#fff}
.list-con{padding:24px 0 40px}
.breadcrumb{background:#fff;height:56px;line-height:56px;padding:0 20px;margin-bottom:20px;font-size:14px;border-bottom:1px solid var(--border)}
.layout{display:flex;gap:20px;align-items:flex-start}
.list-left{width:220px;flex-shrink:0;background:#fff;border:1px solid var(--border)}
.list-left .side-title{background:var(--primary);color:#fff;text-align:center;line-height:48px;font-size:17px}
.list-left ul{list-style:none}
.list-left li a{display:block;padding:12px 16px;font-size:14px;color:var(--text);border-bottom:1px dashed #eee;border-left:3px solid transparent}
.list-left li a:hover,.list-left li a.active{color:var(--primary-light);background:var(--bg-light);border-left-color:var(--primary-light)}
.list-left li.side-group-title{padding:10px 16px 6px;font-size:12px;color:var(--muted);background:#fafafa;border-bottom:1px solid #eee}
.list-right{flex:1;min-width:0;background:#fff;border:1px solid var(--border);padding:24px 28px 32px}
.section-title{font-size:22px;color:var(--primary);font-weight:normal;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--bg-light)}
.college-index-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 16px;padding:12px 14px;background:var(--bg-light);border:1px solid #c8e6d0;border-radius:6px}
.college-index-toolbar input{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--border);border-radius:4px;font-size:14px}
.college-jump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.college-jump a{display:inline-block;padding:4px 10px;font-size:13px;border:1px solid var(--border);border-radius:4px;background:#fff}
.college-block{margin-bottom:12px;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff}
.college-block>summary{cursor:pointer;padding:12px 16px;background:#fafafa;display:flex;justify-content:space-between;list-style:none}
.college-block .college-body{padding:0 12px 12px}
.college-block table{width:100%;border-collapse:collapse;font-size:14px}
.college-block table th.col-seq,.college-block table td.col-seq{width:52px;text-align:center;white-space:nowrap;color:var(--primary)}
.college-block table td.reg-title{word-break:break-word;line-height:1.4;max-width:48em}
.college-block th,.college-block td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
.college-block th{background:var(--bg-light);font-weight:normal}
.ext-tag{display:inline-block;padding:2px 8px;background:#eee;border-radius:3px;font-size:12px;color:var(--muted)}
.index-empty{padding:24px;text-align:center;color:var(--muted)}
.open-link{display:inline-block;padding:2px 10px;background:var(--primary);color:#fff!important;border-radius:3px;font-size:12px}
.shixun-ke-tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:16px}
.shixun-ke-tabs button{appearance:none;border:none;background:#fff;color:var(--teal);font-size:15px;padding:10px 18px;cursor:pointer;border-radius:6px 6px 0 0;margin-bottom:-1px}
.shixun-ke-tabs button.active{color:var(--primary);box-shadow:inset 0 -3px 0 var(--primary)}
.shixun-ke-panel{display:none} .shixun-ke-panel.active{display:block}
.shixun-ke-biz-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.shixun-ke-biz-filter button{border:1px solid #b8e6c8;background:#fff;padding:4px 12px;border-radius:16px;font-size:13px;cursor:pointer}
.shixun-ke-biz-filter button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.shixun-ke-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px}
.shixun-ke-table{width:100%;border-collapse:collapse;font-size:14px}
.shixun-ke-table th,.shixun-ke-table td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.shixun-ke-table th{background:var(--bg-light);white-space:nowrap;font-weight:normal}
.shixun-ke-kdocs{margin-top:16px;padding:12px 14px;background:var(--bg-light);border:1px solid #c8e6d0;border-radius:6px;font-size:14px}
.ledger-online{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin:16px 0 20px;padding:16px 18px;background:var(--bg-light);border:1px solid #c8e6d0;border-radius:8px}
.ledger-online-qr{width:132px;height:132px;object-fit:contain;border:1px solid #dce8e0;border-radius:6px;background:#fff;padding:6px}
.ledger-online-body{flex:1;min-width:220px}
.ledger-online-body h3{margin:0 0 8px;font-size:17px;color:var(--primary);font-weight:normal}
.ledger-online-body p{margin:0 0 10px;font-size:14px;color:var(--muted);line-height:1.6}
a.ledger-link{display:inline-block;padding:6px 14px;background:var(--primary);color:#fff!important;border-radius:4px;font-size:14px}
a.ledger-link:hover{background:var(--primary-dark)}
.ledger-online-url{display:block;margin-top:8px;font-size:12px;color:var(--teal);word-break:break-all}
.ledger-mod-tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--border);margin:8px 0 16px}
.ledger-mod-tabs button{appearance:none;border:none;background:#fff;color:var(--teal);font-size:15px;padding:10px 18px;cursor:pointer;border-radius:6px 6px 0 0;margin-bottom:-1px}
.ledger-mod-tabs button.active{color:var(--primary);box-shadow:inset 0 -3px 0 var(--primary);font-weight:700}
.ledger-mod-panel{display:none}
.ledger-mod-panel.active{display:block}
.ledger-boards-wrap{border:1px solid #c8e6d0;border-radius:8px;overflow:hidden;background:#f7faf8;min-height:72vh}
.ledger-boards-wrap iframe{display:block;width:100%;height:min(82vh,920px);border:0;background:#fff}
.ledger-boards-hint{padding:10px 14px;font-size:13px;color:var(--muted);background:#f1fff3;border-bottom:1px solid #c8e6d0}
.ledger-boards-hint a{margin-left:8px}
body.ledger-boards-on .list-right{padding:16px 16px 20px}
body.ledger-boards-on .list-con > .web{max-width:1480px}

.wl-intro{font-size:14px;color:var(--muted);margin-bottom:14px;padding:10px 14px;background:var(--bg-light);border-radius:6px;border-left:3px solid var(--primary)}
.wl-group{margin-bottom:12px}
.wl-group>summary .wl-seq{display:inline-block;min-width:28px;height:28px;line-height:28px;text-align:center;background:var(--primary);color:#fff;border-radius:4px;font-size:14px;margin-right:10px}
.wl-tasks{padding:8px 12px 12px}
.wl-task{padding:14px 16px;margin-bottom:8px;background:#fafafa;border:1px solid var(--border);border-radius:6px;border-left:3px solid #c8e6d0}
.wl-task:last-child{margin-bottom:0}
.wl-task:hover{background:var(--bg-light);border-left-color:var(--primary)}
.wl-task-main{font-size:15px;color:var(--text);line-height:1.65;margin-bottom:8px}
.wl-task-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wl-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;line-height:1.6}
.wl-badge-freq{background:#e8f5ec;color:#006b35;border:1px solid #c8e6d0}
.wl-badge-owner{background:#fff;color:var(--teal);border:1px solid #b8d8dc}
.wl-task-note{margin-top:8px;padding:8px 10px;background:#fff;border-radius:4px;font-size:13px;color:var(--muted);border-left:2px solid #ddd}
.wl-footnote{margin-top:16px;padding:12px 14px;background:#fffbe6;border:1px solid #f0e6a6;border-radius:6px;font-size:13px;color:#666}
.liaison-section{margin-top:28px;padding-top:20px;border-top:2px solid var(--bg-light)}
.liaison-section h3{font-size:18px;color:var(--primary);font-weight:normal;margin-bottom:12px}
.liaison-staff-table td.phone{white-space:nowrap;font-family:Consolas,monospace;font-size:13px}
.liaison-staff-table .staff-name{color:var(--primary)}
.liaison-view-switch{display:flex;gap:8px;margin-bottom:12px}
.liaison-view-switch button{border:1px solid #b8e6c8;background:#fff;padding:6px 14px;border-radius:16px;font-size:13px;cursor:pointer}
.liaison-view-switch button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.highlight-box{padding:14px 16px;background:var(--bg-light);border-left:4px solid var(--primary);margin:12px 0;font-size:15px}
.tag{display:inline-block;padding:2px 10px;margin:2px 4px 2px 0;background:var(--bg-light);border:1px solid #c8e6d0;border-radius:12px;font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:12px 0}
.grid-card{padding:14px;border:1px solid var(--border);border-radius:6px;background:#fafafa}
.grid-card h4{color:var(--primary);font-weight:normal;margin-bottom:6px}
.news-list{list-style:none;margin:8px 0 12px 0}
.news-list li{padding:6px 0 6px 14px;border-left:3px solid #c8e6d0;margin-bottom:4px}
.portal-cards span{font-size:13px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.stat-card{padding:16px;background:#fff;border:1px solid var(--border);border-radius:6px;text-align:center}
.stat-card.primary{border-color:var(--primary)}
.stat-num{font-size:28px;color:var(--primary);line-height:1.2}
.stat-label{font-size:13px;color:var(--muted);margin-top:4px}
.stat-sub{font-size:12px;color:var(--muted)}
.stat-split{opacity:.5;margin:0 2px}
.stat-note{font-size:13px;color:var(--muted);margin-bottom:12px}
figure{margin:16px 0;text-align:center}
figure img{max-width:100%;height:auto;border:1px solid var(--border)}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
table th,table td{padding:8px 10px;border:1px solid var(--border)}
table th{background:var(--bg-light);font-weight:normal}
.num{text-align:right;white-space:nowrap}
.future-lab-mini-nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.future-lab-mini-nav a{padding:4px 12px;border:1px solid #b8e6c8;border-radius:16px;font-size:13px;background:#fff}
.portal-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:20px 0}
.portal-cards a{display:block;padding:20px;background:#fff;border:1px solid var(--border);border-radius:8px;border-left:4px solid var(--primary)}
.portal-cards a:hover{background:var(--bg-light)}
.portal-cards strong{display:block;font-size:17px;color:var(--primary);margin-bottom:6px;font-weight:normal}
.portal-cards span{font-size:13px;color:var(--muted)}
.home-cockpit-wrap{margin-top:28px;padding-top:22px;border-top:1px solid var(--border)}
.home-cockpit{background:linear-gradient(165deg,#f7fff9 0%,#eef8f1 40%,#f1fff3 100%);border:1px solid #b8e6c8;border-radius:10px;padding:18px 16px 14px;box-sizing:border-box}
.cockpit-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.cockpit-head h2{margin:0;font-size:22px;font-weight:normal;color:var(--primary);letter-spacing:.04em}
.cockpit-head .meta{font-size:12px;color:var(--muted);line-height:1.5;text-align:right}
.cockpit-kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 14px}
.cockpit-kpi .k{background:#fff;border:1px solid #c8e6d0;border-radius:8px;padding:14px 12px;text-align:center;box-shadow:0 1px 0 rgba(0,135,66,.06)}
.cockpit-kpi .k.main{border-color:var(--primary);background:linear-gradient(180deg,#fff 0%,#f1fff3 100%)}
.cockpit-kpi .n{display:block;font-size:32px;line-height:1.1;color:var(--primary);letter-spacing:.02em}
.cockpit-kpi .k.main .n{font-size:36px;color:#006B35}
.cockpit-kpi .l{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.cockpit-body{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:stretch}
.cockpit-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.cockpit-card{background:#fff;border:1px solid #dce8e0;border-radius:8px;padding:12px 12px 10px;min-width:0;flex:1 1 auto}
.cockpit-card h3{margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid #e8f5ec;font-size:14px;font-weight:normal;color:var(--primary)}
.cockpit-table{width:100%;border-collapse:collapse;font-size:12px}
.cockpit-table th,.cockpit-table td{padding:5px 6px;border-bottom:1px solid #eef3ef;text-align:left}
.cockpit-table th{color:var(--muted);font-weight:normal;background:#f7fbf8}
.cockpit-table td.num{text-align:right;color:var(--primary);white-space:nowrap}
.cockpit-table tr:last-child td{border-bottom:0}
.cockpit-table.compact{font-size:11px}
.cockpit-table.compact th,.cockpit-table.compact td{padding:4px 4px;vertical-align:top;line-height:1.35}
.cockpit-table .lv1{color:#d51917}
.cockpit-table .lv2{color:#c45a12}
.cockpit-filing-note{margin:6px 0 0;font-size:11px;color:var(--muted);line-height:1.45}
.cockpit-card.span-full{grid-column:1 / -1}
.cockpit-body-extra{margin-top:12px}
.cockpit-rank{list-style:none;margin:0;padding:0}
.cockpit-rank li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #eef3ef;font-size:12px}
.cockpit-rank li:last-child{border-bottom:0}
.cockpit-rank .rk{width:20px;height:20px;border-radius:4px;background:#e8f5ec;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px}
.cockpit-rank li:nth-child(1) .rk{background:#008742;color:#fff}
.cockpit-rank li:nth-child(2) .rk{background:#218483;color:#fff}
.cockpit-rank li:nth-child(3) .rk{background:#c45a12;color:#fff}
.cockpit-rank .nm{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cockpit-rank .ct{color:var(--primary)}
.cockpit-donut-wrap{display:flex;align-items:center;gap:12px}
.cockpit-donut-wrap svg{flex:0 0 auto}
.cockpit-legend{list-style:none;margin:0;padding:0;font-size:12px;line-height:1.75;color:var(--muted);flex:1}
.cockpit-legend li{display:flex;align-items:center;gap:6px}
.cockpit-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.cockpit-legend b{color:var(--text);font-weight:normal;margin-left:auto}
.cockpit-bars{display:flex;flex-direction:column;gap:6px}
.cockpit-bar-row{display:grid;grid-template-columns:72px 1fr 36px;gap:6px;align-items:center;font-size:12px}
.cockpit-bar-row .name{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cockpit-bar-row .track{height:8px;background:#eef6f0;border-radius:4px;overflow:hidden}
.cockpit-bar-row .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#218483,#008742)}
.cockpit-bar-row .val{text-align:right;color:var(--text)}
.cockpit-vbars{display:flex;align-items:flex-end;justify-content:space-around;gap:10px;min-height:110px;padding:8px 4px 0}
.cockpit-vbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:80px}
.cockpit-vbar .col{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#00a85a,#008742);min-height:4px}
.cockpit-vbar .col.c2{background:linear-gradient(180deg,#3aa8a6,#218483)}
.cockpit-vbar .col.c3{background:linear-gradient(180deg,#f0a04a,#c45a12)}
.cockpit-vbar .vn{font-size:13px;color:var(--primary)}
.cockpit-vbar .vl{font-size:11px;color:var(--muted);text-align:center}
.cockpit-haz-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cockpit-haz{display:flex;flex-direction:column;gap:2px;padding:10px 10px;border-radius:6px;background:#f7fbf8;border:1px solid #e8f5ec}
.cockpit-haz .hn{font-size:20px;color:var(--primary);line-height:1.1}
.cockpit-haz .hl{font-size:12px;color:var(--muted)}
.cockpit-pending{margin:0;font-size:12px;color:var(--muted);line-height:1.55}
.cockpit-modules{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cockpit-modules a{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;border:1px solid #c8e6d0;background:#fff;color:var(--primary)}
.cockpit-modules a:hover{background:var(--bg-light)}
.cockpit-foot{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.5;text-align:center}
.home-bottom{display:grid;grid-template-columns:1.15fr 0.85fr;gap:20px;margin-top:20px;align-items:stretch}
.home-panel{background:var(--bg-light);border:1px solid #c8e6d0;border-radius:8px;padding:16px 16px 14px;min-width:0;display:flex;flex-direction:column;height:100%;box-sizing:border-box}
.home-panel h2{font-size:18px;color:var(--primary);font-weight:normal;margin:0 0 8px;flex:0 0 auto}
.home-panel .panel-desc{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.55;flex:0 0 auto}
.home-panel figure{margin:0;display:flex;flex-direction:column}
.home-calendar figure{flex:0 0 auto}

<script>
(function(){
  const form=document.getElementById('banner-search-form');
  const input=document.getElementById('banner-search');
  const panel=document.getElementById('global-search-results');
  if(!form||!input||!panel)return;
  let INDEX=window.SITE_SEARCH||[]; if(!INDEX.length)return;

  function hay(it){
    return [it.t,it.rn,it.b,it.c,it.g,it.m,it.x,it.tab].filter(Boolean).join(' ').toLowerCase();
  }

  function renderResults(q){
    const kw=(q||'').trim().toLowerCase();
    if(!kw){panel.hidden=true;panel.innerHTML='';return;}
    const hits=INDEX.filter(it=>hay(it).includes(kw)).slice(0,40);
    if(!hits.length){panel.hidden=false;panel.innerHTML='<div class="gs-head">未找到匹配内容</div>';return;}
    panel.hidden=false;
    panel.innerHTML='<div class="gs-head">找到 '+hits.length+' 条 · 点击跳转</div>'+hits.map(it=>{
      const url=it.p+(it.anchor?'#'+it.anchor:'')+(it.tab?'#tab-'+it.tab:'')+'?q='+encodeURIComponent(kw);
      const sub=[it.m,it.c,it.g,it.rn].filter(Boolean).join(' · ');
      return '<a href="'+url+'"><strong>'+(it.t||'—')+'</strong><div class="gs-meta">'+sub+'</div></a>';
    }).join('');
  }

  function applyLocalQuery(q){
    if(!q)return;
    input.value=q;
    ['regs-q','college-docs-q','yishi-q','ledger-q','office-q'].forEach(id=>{
      const el=document.getElementById(id);
      if(el){el.value=q;el.dispatchEvent(new Event('input'));}
    });
    document.querySelectorAll('[id^="gen-q-"]').forEach(el=>{el.value=q;el.dispatchEvent(new Event('input'));});
    const tab=document.querySelector('.shixun-ke-tabs button.active')?.dataset.tab;
    if(tab==='college_liaison'){
      const lq=document.getElementById('liaison-q');
      if(lq){lq.value=q;lq.dispatchEvent(new Event('input'));}
    }
  }

  form.addEventListener('submit',e=>{e.preventDefault();renderResults(input.value);});
  input.addEventListener('input',()=>renderResults(input.value));
  input.addEventListener('focus',()=>{if(input.value.trim())renderResults(input.value);});
  document.addEventListener('click',e=>{
    if(!panel.contains(e.target)&&!form.contains(e.target))panel.hidden=true;
  });

  const q=new URLSearchParams(location.search).get('q');
  if(q){applyLocalQuery(q);renderResults(q);}
})();
</script>
